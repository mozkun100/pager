<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#141414">
  <title data-i18n-title="appName">المنبه</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alexandria:wght@700;900&family=Readex+Pro:wght@400;600;700&display=swap">
  <link rel="stylesheet" href="/style.css">
  <!-- التصميم الحالي: تذكرة (لتغيير التصميم بدّل هذا الملف) -->
  <link rel="stylesheet" href="/themes/ticket.css">
</head>
<body class="customer">
  <!-- شريط يظهر لو انقطع الاتصال -->
  <div id="offlineBar" class="offline-bar hidden" data-i18n="offline">انقطع الاتصال… جاري إعادة الاتصال</div>

  <main class="container">
    <header class="topbar">
      <h1 data-i18n="appName">المنبه</h1>
      <div class="topbar-actions">
        <span id="status" class="status"><span class="dot"></span></span>
        <button class="chip lang-btn" data-i18n="switchLang">English</button>
      </div>
    </header>

    <!-- ========== 1) إدخال رقم الطلب ========== -->
    <section id="viewEntry" class="view">
      <div class="card">
        <label for="numberInput" class="field-label" data-i18n="enterNumber">اكتب رقم طلبك</label>
        <input id="numberInput" class="number-input" type="number" inputmode="numeric"
               min="1" autocomplete="off" data-i18n-placeholder="numberPlaceholder">
        <div id="entryError" class="error hidden"></div>
        <button id="activateBtn" class="btn btn-big" data-i18n="activate">🔔 فعّل التنبيه</button>
      </div>
      <p class="keep-open" data-i18n="keepOpen">📱 خلّ الصفحة مفتوحة عشان يوصلك التنبيه</p>
    </section>

    <!-- ========== 2) متابعة الطلب (مو جاهز / جاهز) ========== -->
    <section id="viewOrder" class="view hidden">
      <!-- يظهر بعد تحديث الصفحة: المتصفح يحتاج ضغطة جديدة عشان يسمح بالصوت -->
      <button id="reactivateBtn" class="btn btn-big btn-reactivate hidden" data-i18n="reactivate">🔔 اضغط هنا لإعادة تفعيل التنبيه</button>

      <div id="orderPanel" class="order-panel">
        <div class="panel-label" data-i18n="orderNo">طلب رقم</div>
        <div id="orderNumber" class="panel-number"></div>
        <div class="perf" aria-hidden="true"></div>
        <div id="orderStatusText" class="panel-status"></div>
        <div id="orderTimer" class="panel-timer"></div>
      </div>

      <!-- يظهر بس والتنبيه شغال — يوقف الصوت والاهتزاز في هذا الجوال فقط -->
      <button id="stopAlarmBtn" class="btn btn-big btn-stop hidden" data-i18n="stopAlarm">🔕 إيقاف التنبيه</button>

      <button id="receivedBtn" class="btn btn-received" data-i18n="btnReceived">تم الاستلام</button>
      <p class="keep-open" data-i18n="keepOpen">📱 خلّ الصفحة مفتوحة عشان يوصلك التنبيه</p>
      <button id="changeNumberBtn" class="link-btn" data-i18n="changeNumber">رقم غلط؟ غيّر الرقم</button>
    </section>

    <!-- ========== 3) شكراً ========== -->
    <section id="viewDone" class="view hidden">
      <div class="card thanks">
        <div class="thanks-icon">🙏</div>
        <h2 data-i18n="thanks">شكراً لك!</h2>
        <p id="thanksBody"></p>
      </div>
      <button id="newOrderBtn" class="btn btn-secondary" data-i18n="trackAnother">متابعة طلب آخر</button>
    </section>
  </main>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/i18n.js"></script>
  <script src="/alarm.js"></script>
  <script src="/customer.js"></script>
</body>
</html>
