<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>المنبه</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main class="container">
    <h1>المنبه</h1>
    <p class="subtitle">صفحة العميل — قيد البناء (المرحلة الثالثة)</p>
    <div class="card">
      <span id="status" class="status"><span class="dot"></span><span id="statusText">غير متصل</span></span>
    </div>
  </main>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();
    const statusEl = document.getElementById('status');
    const statusText = document.getElementById('statusText');
    socket.on('connect', () => { statusEl.classList.add('online'); statusText.textContent = 'متصل بالسيرفر'; });
    socket.on('disconnect', () => { statusEl.classList.remove('online'); statusText.textContent = 'غير متصل'; });
  </script>
</body>
</html>
