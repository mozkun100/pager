<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#141414">
  <title data-i18n-title="appName">المنبه</title>
  <!-- عشان العميل يقدر يضيف المنبه للشاشة الرئيسية (مطلوب للإشعارات في الآيفون) -->
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="المنبه">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alexandria:wght@700;900&family=Readex+Pro:wght@400;600;700&display=swap">
  <link rel="stylesheet" href="/style.css">
  <!-- التصميم الحالي: تذكرة (لتغيير التصميم بدّل هذا الملف) -->
  <link rel="stylesheet" href="/themes/ticket.css">
</head>
<body class="customer">
  <!-- شريط يظهر لو انقطع الاتصال -->
  <div id="offlineBar" class="offline-bar hidden" data-i18n="offline">انقطع الاتصال… جاري إعادة الاتصال</div>

  <main class="container">
    <header class="topbar">
      <h1 data-i18n="appName">المنبه</h1>
      <div class="topbar-actions">
        <span id="status" class="status"><span class="dot"></span></span>
        <button class="chip lang-btn" data-i18n="switchLang">English</button>
      </div>
    </header>

    <!-- ========== 1) إدخال رقم الطلب ========== -->
    <section id="viewEntry" class="view">
      <div class="card">
        <label for="numberInput" class="field-label" data-i18n="enterNumber">اكتب رقم طلبك</label>
        <input id="numberInput" class="number-input" type="number" inputmode="numeric"
               min="1" autocomplete="off" data-i18n-placeholder="numberPlaceholder">
        <div id="entryError" class="error hidden"></div>
        <button id="activateBtn" class="btn btn-big" data-i18n="activate">🔔 فعّل التنبيه</button>
      </div>
      <p class="keep-open" data-i18n="keepOpen">📱 خلّ الصفحة مفتوحة عشان يوصلك التنبيه</p>
    </section>

    <!-- ========== 2) متابعة الطلب (مو جاهز / جاهز) ========== -->
    <section id="viewOrder" class="view hidden">
      <!-- يظهر بعد تحديث الصفحة: المتصفح يحتاج ضغطة جديدة عشان يسمح بالصوت -->
      <button id="reactivateBtn" class="btn btn-big btn-reactivate hidden" data-i18n="reactivate">🔔 اضغط هنا لإعادة تفعيل التنبيه</button>

      <div id="orderPanel" class="order-panel">
        <div class="panel-label" data-i18n="orderNo">طلب رقم</div>
        <div id="orderNumber" class="panel-number"></div>
        <div class="perf" aria-hidden="true"></div>
        <div id="orderStatusText" class="panel-status"></div>
        <div id="orderTimer" class="panel-timer"></div>
      </div>

      <!-- ألعاب الانتظار: يظهر بس والطلب مو جاهز -->
      <button id="playBtn" class="btn btn-play hidden" data-i18n="playWhileWaiting">🎮 العب وأنت تنتظر</button>

      <!-- يظهر بس والتنبيه شغال — يوقف الصوت والاهتزاز في هذا الجوال فقط -->
      <button id="stopAlarmBtn" class="btn btn-big btn-stop hidden" data-i18n="stopAlarm">🔕 إيقاف التنبيه</button>

      <p id="orderHint" class="keep-open" data-i18n="keepOpen">📱 خلّ الصفحة مفتوحة عشان يوصلك التنبيه</p>
      <button id="changeNumberBtn" class="link-btn" data-i18n="changeNumber">رقم غلط؟ غيّر الرقم</button>
    </section>

    <!-- ========== 3) شكراً ========== -->
    <section id="viewDone" class="view hidden">
      <div class="card thanks">
        <div class="thanks-icon">🙏</div>
        <h2 data-i18n="thanks">شكراً لك!</h2>
        <p id="thanksBody"></p>
      </div>
      <button id="newOrderBtn" class="btn btn-secondary" data-i18n="trackAnother">متابعة طلب آخر</button>
    </section>
  </main>

  <!-- ===== بطاقة "طلبك جاهز" (تطلع فوق كل شي، حتى فوق اللعبة) ===== -->
  <div id="readyCard" class="ready-modal" hidden>
    <div class="ready-box" role="alertdialog" aria-labelledby="readyTitle">
      <div class="ready-emoji">🎉</div>
      <h2 id="readyTitle" data-i18n="readyTitle">طلبك جاهز!</h2>
      <div id="readyNum" class="ready-num"></div>
      <p data-i18n="readyBody">تفضّل استلمه من الكاشير</p>
      <button id="readyOkBtn" class="btn btn-big ready-ok" data-i18n="readyOk">تمام، جاي ✅</button>
    </div>
  </div>

  <!-- ===== ألعاب الانتظار (شاشة كاملة فوق الصفحة) ===== -->
  <div id="gamesOverlay" class="games-overlay" hidden>
    <div class="games-menu">
      <header class="games-bar">
        <h2 data-i18n="gamesTitle">العب وأنت تنتظر</h2>
        <button class="chip games-close" data-i18n="closeGames">✕ إغلاق</button>
      </header>
      <p class="games-note" data-i18n="gamesNote"></p>
      <div class="games-list"></div>
    </div>
    <div class="games-play" hidden>
      <header class="games-bar">
        <button class="chip games-back" data-i18n="otherGames">الألعاب</button>
        <div class="game-title"></div>
        <button class="chip games-close" data-i18n="closeGames">✕ إغلاق</button>
      </header>
      <div class="game-meta"><span class="game-score"></span><span class="game-best"></span></div>
      <div class="game-stage"></div>
      <div class="game-result" hidden></div>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/i18n.js"></script>
  <script src="/alarm.js"></script>
  <script src="/games.js"></script>
  <script src="/customer.js"></script>
</body>
</html>
