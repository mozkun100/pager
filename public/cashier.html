<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-i18n-title="cashierTitle">لوحة الكاشير</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <!-- ===== شاشة الرمز (تظهر قبل اللوحة) ===== -->
  <main id="lockView" class="container lock-view hidden">
    <div class="topbar">
      <span></span>
      <button class="chip lang-btn" data-i18n="switchLang">English</button>
    </div>
    <form id="pinForm" class="card lock-card" autocomplete="off">
      <div class="lock-icon">🔒</div>
      <h1 id="lockTitle"></h1>
      <p id="lockHint" class="subtitle"></p>
      <div id="lockedOutMsg" class="note hidden" data-i18n="lockedOut"></div>

      <input id="pinInput" class="pin-input" type="password" inputmode="numeric"
             maxlength="4" pattern="[0-9]*" autocomplete="off" placeholder="••••">
      <input id="pinConfirmInput" class="pin-input hidden" type="password" inputmode="numeric"
             maxlength="4" pattern="[0-9]*" autocomplete="off" data-i18n-placeholder="pinConfirm">

      <div id="pinError" class="error hidden"></div>
      <button id="pinSubmit" type="submit" class="btn btn-big"></button>
      <p id="forgotPin" class="forgot hidden" data-i18n="forgotPin"></p>
    </form>
  </main>

  <main id="appView" class="container wide hidden">

    <!-- الشريط العلوي -->
    <header class="topbar">
      <h1 data-i18n="cashierTitle">لوحة الكاشير</h1>
      <div class="topbar-actions">
        <span id="status" class="status"><span class="dot"></span><span id="statusText"></span></span>
        <a href="/qr" class="chip" data-i18n="printQr">🖨️ طباعة QR</a>
        <button class="chip lang-btn" data-i18n="switchLang">English</button>
        <button id="lockBtn" class="chip" data-i18n="lockDevice">🔒 قفل</button>
      </div>
    </header>

    <!-- زر طلب جديد + آخر رقم -->
    <section class="card new-order">
      <button id="newOrderBtn" class="btn btn-big" disabled data-i18n="newOrder">+ طلب جديد</button>
      <div id="lastNumberBox" class="last-number hidden">
        <span class="label" data-i18n="newNumber">الرقم الجديد</span>
        <span id="lastNumber" class="number"></span>
        <span class="hint" data-i18n="tellCustomer">بلّغ العميل بهذا الرقم</span>
      </div>
      <div id="newOrderError" class="error hidden"></div>
    </section>

    <!-- قائمة الطلبات النشطة -->
    <section>
      <h2 class="section-title"><span data-i18n="activeOrders">الطلبات النشطة</span> <span id="activeCount" class="count">0</span></h2>
      <div id="emptyState" class="empty" data-i18n="noActiveOrders">ما فيه طلبات نشطة حالياً</div>
      <div id="ordersGrid" class="orders-grid"></div>
    </section>

    <!-- الإعدادات -->
    <details class="card settings">
      <summary data-i18n="settings">⚙️ الإعدادات</summary>
      <label for="maxInput" data-i18n="maxLabel">أعلى رقم للطلبات (بعده يرجع الترقيم إلى 1)</label>
      <div class="row">
        <input id="maxInput" type="number" min="1" max="9999" inputmode="numeric">
        <button id="saveMaxBtn" class="btn btn-small" data-i18n="save">حفظ</button>
      </div>
      <div id="settingsMsg" class="hidden"></div>

      <hr class="divider">
      <h3 class="settings-sub" data-i18n="changePinTitle">تغيير رمز الدخول</h3>
      <form id="changePinForm" class="pin-change" autocomplete="off">
        <input id="currentPinInput" class="pin-small" type="password" inputmode="numeric" maxlength="4" data-i18n-placeholder="currentPin">
        <input id="newPinInput" class="pin-small" type="password" inputmode="numeric" maxlength="4" data-i18n-placeholder="newPin">
        <button type="submit" class="btn btn-small" data-i18n="changePinBtn">تغيير الرمز</button>
      </form>
      <div id="pinChangeMsg" class="hidden"></div>
    </details>
  </main>

  <!-- قالب بطاقة الطلب (نسخة منه لكل طلب) -->
  <template id="orderTemplate">
    <article class="order-card">
      <div class="order-head">
        <span class="order-number"></span>
        <span class="badge"></span>
      </div>
      <div class="order-timer"></div>
      <div class="order-actions">
        <button class="btn btn-ready"></button>
        <button class="btn btn-close"></button>
      </div>
    </article>
  </template>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/i18n.js"></script>
  <script src="/cashier.js"></script>
</body>
</html>
