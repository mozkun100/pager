<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>المنبه — لوحة الكاشير</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main class="container wide">

    <!-- الشريط العلوي -->
    <header class="topbar">
      <h1>لوحة الكاشير</h1>
      <span id="status" class="status"><span class="dot"></span><span id="statusText">غير متصل</span></span>
    </header>

    <!-- زر طلب جديد + آخر رقم -->
    <section class="card new-order">
      <button id="newOrderBtn" class="btn btn-big" disabled>+ طلب جديد</button>
      <div id="lastNumberBox" class="last-number hidden">
        <span class="label">الرقم الجديد</span>
        <span id="lastNumber" class="number"></span>
        <span class="hint">بلّغ العميل بهذا الرقم</span>
      </div>
      <div id="newOrderError" class="error hidden"></div>
    </section>

    <!-- قائمة الطلبات النشطة -->
    <section>
      <h2 class="section-title">الطلبات النشطة <span id="activeCount" class="count">0</span></h2>
      <div id="emptyState" class="empty">ما فيه طلبات نشطة حالياً</div>
      <div id="ordersGrid" class="orders-grid"></div>
    </section>

    <!-- الإعدادات -->
    <details class="card settings">
      <summary>⚙️ الإعدادات</summary>
      <label for="maxInput">أعلى رقم للطلبات (بعده يرجع الترقيم إلى 1)</label>
      <div class="row">
        <input id="maxInput" type="number" min="1" max="9999" inputmode="numeric">
        <button id="saveMaxBtn" class="btn btn-small">حفظ</button>
      </div>
      <div id="settingsMsg" class="hidden"></div>
    </details>
  </main>

  <!-- قالب بطاقة الطلب (نسخة منه لكل طلب) -->
  <template id="orderTemplate">
    <article class="order-card">
      <div class="order-head">
        <span class="order-number"></span>
        <span class="badge"></span>
      </div>
      <div class="order-timer"></div>
      <div class="order-actions">
        <button class="btn btn-ready">جاهز</button>
        <button class="btn btn-close">تم الاستلام</button>
      </div>
    </article>
  </template>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/cashier.js"></script>
</body>
</html>
